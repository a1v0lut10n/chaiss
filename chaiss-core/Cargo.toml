[package]
name = "chaiss-core"
version = "0.7.0"
edition = "2021"
authors = ["Hans Van Wesenbeeck <hvw@aivolution.ch>"]
description = "Intelligent backend AI Core mapping chess geometry organically."
license = "Apache-2.0"
repository = "https://github.com/a1v0lut10n/chaiss"
homepage = "https://github.com/a1v0lut10n/chaiss"
keywords = ["chess", "llm", "ai"]
categories = ["games", "algorithms", "science"]

[dependencies]
flume = "0.12.0"
futures = "0.3.32"
# Pinned: llm 1.3.8 sends every OpenAI-backend request to the Responses API
# (`/responses`), which Gemini's OpenAI-compatible endpoint does not serve
# (404). 1.3.7 still posts to `chat/completions`. See CHAI-0058.
llm = { version = "=1.3.7", features = ["google", "openai", "anthropic"] }
# The workspace's own configuration language (.chaiss.cola).
colap = { version = "0.5", default-features = false }
reqwest = { version = "0.13.2", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = [
    "runtime-tokio-rustls",
    "sqlite",
    "migrate",
] }
tokio = { version = "1.50.0", features = ["full"] }
