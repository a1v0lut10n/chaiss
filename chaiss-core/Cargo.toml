[package]
name = "chaiss-core"
version = "0.3.2"
edition = "2021"
authors = ["Hans Van Wesenbeeck <hvw@aivolution.ch>"]
description = "Intelligent backend AI Core mapping chess geometry organically."
license = "Apache-2.0"
repository = "https://github.com/a1v0lut10n/chaiss"
homepage = "https://github.com/a1v0lut10n/chaiss"
keywords = ["chess", "llm", "ai"]
categories = ["games", "algorithms", "science"]

[dependencies]
flume = "0.12.0"
futures = "0.3.32"
llm = { version = "1.3.7", features = ["google", "openai", "anthropic"] }
reqwest = { version = "0.13.2", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = [
    "runtime-tokio-rustls",
    "sqlite",
    "migrate",
] }
tokio = { version = "1.50.0", features = ["full"] }
