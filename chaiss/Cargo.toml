[package]
name = "chaiss"
version = "0.6.0"
edition = "2021"
authors = ["Hans Van Wesenbeeck <hvw@aivolution.ch>"]
description = "An intelligent, AI-assisted chessboard built from the ground up natively in Egui."
license = "Apache-2.0"
repository = "https://github.com/a1v0lut10n/chaiss"
homepage = "https://github.com/a1v0lut10n/chaiss"
keywords = ["egui", "chess", "desktop", "llm"]
categories = ["games", "gui"]

[dependencies]
# `experimental` enables egui's theme plugin (StyleProvider), used by
# src/ui/theme.rs. It carries no semver promise: on every egui upgrade,
# check the theme first.
eframe = { version = "0.37", features = ["experimental"] }
tokio = { version = "1.0", features = ["full"] }
flume = "0.12.0"
chaiss-core = { version = "0.6.0", path = "../chaiss-core" }
egui_extras = { version = "0.37", features = ["svg", "image"] }
dotenvy = "0.15.7"
egui_commonmark = "0.26.0"
image = "0.25.10"

# Linux only: winit's X11 builder extension, to force X11 under WSL (see
# src/wsl.rs). eframe does not re-export it; unifies with eframe's winit.
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["x11"] }

[dev-dependencies]
# egui's own headless harness (no GPU): theme geometry and AccessKit tests.
egui_kittest = "0.37"

[features]
# Opt-in egui UI inspection: pulls in eframe's inspection plugin (egui_inspection +
# accesskit). At runtime, launch with EGUI_INSPECTION=1 to expose the live UI tree
# on 127.0.0.1:5719 for the egui-mcp server. Normal and release builds are
# unaffected. See tools/scripts/setup-egui-mcp.sh.
inspection = ["eframe/inspection"]
