[package]
name = "chaiss"
version = "0.1.0"
edition = "2021"
authors = ["Hans Van Wesenbeeck <hvw@aivolution.ch>"]
description = "An intelligent, AI-assisted chessboard built from the ground up natively in Egui."
license = "Apache-2.0"
repository = "https://github.com/a1v0lut10n/chaiss"
keywords = ["egui", "chess", "desktop", "llm"]

[dependencies]
eframe = "0.34.1" 
tokio = { version = "1.0", features = ["full"] }
flume = "0.12.0"
chaiss-core = { version = "0.1.1", path = "../chaiss-core" }
egui_extras = { version = "0.34.1", features = ["svg", "image"] }
dotenvy = "0.15.7"
egui_commonmark = "0.23.0"
image = "0.25.10"
