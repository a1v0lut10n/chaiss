name: Rust CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  # Critically required for sqlx to compile without a live database
  SQLX_OFFLINE: true

jobs:
  validate:
    name: Code Quality & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux Crate Dependencies (Egui & Winit)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libasound2-dev

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Verify Code Formatting
        run: cargo fmt --all -- --check

      - name: Verify Strict Clippy Lints
        run: cargo clippy --workspace -- -D warnings

      - name: Execute Workspace Unit Tests
        run: cargo test --workspace
