name: Rust CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    # `edited` covers a base-branch change: when a stacked PR's base is
    # merged and deleted, GitHub retargets the next PR to main, and without
    # this type the required checks never run for it.
    types: [ opened, synchronize, reopened, edited ]

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Verify Formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # No apt step: the tree links no system library beyond libssl (preinstalled
      # with pkg-config on the Ubuntu images). wayland-sys is built with its
      # `dlopen` feature, winit's x11-dl and xkbcommon-dl load their libraries at
      # run time, and nothing needs ALSA. The step only added a dependency on the
      # apt mirrors, which failed to resolve for every run on 2026-11-11.
      - uses: Swatinem/rust-cache@v2
      - name: Verify Strict Lints
        run: cargo clippy --workspace -- -D warnings

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Execute Workspace Unit Tests
        run: cargo test --workspace
